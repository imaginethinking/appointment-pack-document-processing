[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[project]
name = "appointment-pack-document-processing"
version = "0.1.0"
description = "Internal document processing service for The Appointment Pack"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "pydantic-settings==2.14.2",
    "python-multipart==0.0.32",
    "uvicorn[standard]==0.52.0",
    "pymupdf==1.28.0",
    "Pillow>=11.0,<13.0",
    "pytesseract>=0.3.13,<1.0",
    "numpy>=2.0,<3.0",
    "opencv-python-headless==4.14.0.94"
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.15.22"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers"
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"